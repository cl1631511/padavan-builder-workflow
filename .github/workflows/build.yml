name: Build Single doh_proxy Binary

on:
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    container: registry.gitlab.com/hadzhioglu/padavan-ng  # 使用已配好环境的容器
    defaults:
      run:
        shell: bash

    steps:
    # 1. 检出你的配置文件仓库 (包含 variables, build.config 等)
    - name: Checkout configs
      uses: actions/checkout@v4

    # 2. 读取 variables 文件，获取源码仓库、分支、工具链地址等信息
    - name: Load variables
      run: |
        sed -i 's|\r$||g' variables build.config
        . <(cat variables build.config)
        for v in "${!PADAVAN_@}"; do
          echo "$v=${!v}" >> $GITHUB_ENV
        done

    # 3. 克隆完整的 padavan-ng 源码 (这是编译所必需的)
    - name: Clone padavan-ng source
      run: |
        git config --global --add safe.directory '*'
        git clone -b "$PADAVAN_BRANCH" "$PADAVAN_REPO"
        git -C padavan-ng checkout "$PADAVAN_COMMIT"

    # 4. 下载并解压交叉编译工具链 (这是关键依赖)
    - name: Download toolchain
      run: |
        wget -qO- "$PADAVAN_TOOLCHAIN_URL" | tar -C padavan-ng --zstd -xf -

    # 5. 核心步骤: 只编译 doh_proxy 插件
    - name: Build doh_proxy only
      run: |
        cd padavan-ng/trunk/user/doh_proxy
        echo "Starting single plugin build..."
        # 直接执行 make，它会根据 Makefile 完成下载、配置和编译
        make
        # 检查编译结果
        if [[ -f https_dns_proxy/build/https_dns_proxy ]]; then
          echo "Build successful!"
          ls -lh https_dns_proxy/build/https_dns_proxy
        else
          echo "Build failed: binary not found"
          exit 1
        fi

    # 6. 上传编译好的二进制文件作为 Artifact
    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: doh_proxy-binary
        path: padavan-ng/trunk/user/doh_proxy/https_dns_proxy/build/https_dns_proxy
        retention-days: 7
